<style>
  :root {
    --dorado: #CE9816;
    --dorado-claro: #F6EBD0;
    --negro: #111111;
    --gris: #666666;
    --gris-claro: #E6E6E6;
    --fondo: #F5F5F3;
    --blanco: #FFFFFF;
    --rojo: #B3261E;
    --rojo-claro: #FBE9E7;
    --verde: #2E7D32;
    --verde-claro: #E8F5E9;
    --radio: 8px;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--fondo);
    color: var(--negro);
    font-family: Arial, Helvetica, sans-serif;
    font-size: 16px;
    line-height: 1.4;
    -webkit-text-size-adjust: 100%;
  }

  .oculto { display: none !important; }

  /* ---------- Entrada ---------- */
  .entrada {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    background: var(--negro);
  }
  .entrada-caja {
    width: 100%;
    max-width: 380px;
    background: var(--blanco);
    border-radius: var(--radio);
    padding: 24px 20px;
    border-top: 5px solid var(--dorado);
  }
  .entrada-caja h1 { font-size: 20px; margin: 6px 0 18px; }

  .marca {
    font-weight: bold;
    letter-spacing: 2px;
    color: var(--dorado);
    font-size: 15px;
  }
  .marca span { color: var(--blanco); letter-spacing: 0; font-weight: normal; margin-left: 6px; }

  /* ---------- Cabecera ---------- */
  .cabecera {
    background: var(--negro);
    color: var(--blanco);
    position: sticky;
    top: 0;
    z-index: 20;
  }
  .cabecera-fila {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 16px 8px;
    max-width: 960px;
    margin: 0 auto;
  }
  .usuario { font-size: 14px; display: flex; gap: 10px; align-items: center; }
  .usuario .enlace { color: var(--dorado); }

  .pestanas {
    display: flex;
    max-width: 960px;
    margin: 0 auto;
  }
  .pestana {
    flex: 1;
    background: none;
    border: 0;
    border-bottom: 3px solid transparent;
    color: #BBBBBB;
    padding: 10px 4px;
    font: inherit;
    font-size: 15px;
    cursor: pointer;
  }
  .pestana.activa { color: var(--blanco); border-bottom-color: var(--dorado); font-weight: bold; }

  /* ---------- Aviso de pendientes ---------- */
  .aviso-pendientes {
    background: var(--dorado-claro);
    border-bottom: 2px solid var(--dorado);
    color: var(--negro);
    padding: 10px 16px;
  }
  .aviso-fila {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: space-between;
    align-items: center;
    max-width: 960px;
    margin: 0 auto;
  }
  .aviso-botones { display: flex; gap: 6px; }
  .lista-pendientes {
    list-style: none;
    margin: 10px auto 0;
    padding: 0;
    max-width: 960px;
    max-height: 45vh;
    overflow-y: auto;
  }
  .lista-pendientes li {
    background: var(--blanco);
    border-radius: 6px;
    padding: 8px 10px;
    margin-bottom: 6px;
    font-size: 14px;
  }
  .lista-pendientes li.con-error { border-left: 4px solid var(--rojo); }
  .lista-pendientes .pend-error { color: var(--rojo); font-size: 13px; margin-top: 4px; }
  .lista-pendientes .pend-botones { display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; }

  /* ---------- Contenido ---------- */
  main {
    max-width: 960px;
    margin: 0 auto;
    padding: 16px;
  }

  fieldset {
    border: 0;
    background: var(--blanco);
    border-radius: var(--radio);
    padding: 14px 14px 6px;
    margin: 0 0 14px;
  }
  legend {
    font-weight: bold;
    font-size: 15px;
    padding: 0;
    float: left;
    width: 100%;
    margin-bottom: 8px;
    border-left: 4px solid var(--dorado);
    padding-left: 8px;
  }
  legend + * { clear: both; }

  label {
    display: block;
    font-size: 14px;
    color: var(--gris);
    margin: 8px 0 4px;
  }
  label b { color: var(--dorado); }

  input, select, textarea {
    width: 100%;
    font: inherit;
    font-size: 16px; /* evita el zoom automático en iPhone */
    padding: 10px;
    border: 1px solid #CCCCCC;
    border-radius: 6px;
    background: var(--blanco);
    color: var(--negro);
    margin-bottom: 6px;
  }
  input:focus, select:focus, textarea:focus {
    outline: 2px solid var(--dorado);
    border-color: var(--dorado);
  }
  .campo-error { border-color: var(--rojo) !important; background: var(--rojo-claro) !important; }

  textarea { resize: vertical; min-height: 90px; }

  .dos-columnas { display: grid; grid-template-columns: 1fr; gap: 0 12px; }
  @media (min-width: 560px) {
    .dos-columnas { grid-template-columns: 1fr 1fr; }
  }

  .nota { color: var(--gris); font-size: 13px; font-weight: normal; }

  /* ---------- Botones ---------- */
  .btn {
    display: inline-block;
    border: 0;
    border-radius: 6px;
    padding: 12px 18px;
    font: inherit;
    font-weight: bold;
    cursor: pointer;
    background: var(--negro);
    color: var(--blanco);
  }
  .btn:disabled { opacity: .5; cursor: default; }
  .btn-principal { background: var(--dorado); color: var(--negro); width: 100%; font-size: 17px; }
  .btn-claro { background: var(--blanco); color: var(--negro); border: 1px solid var(--negro); }
  .btn-peligro { background: var(--blanco); color: var(--rojo); border: 1px solid var(--rojo); }
  .btn-mini { padding: 7px 12px; font-size: 14px; }
  .enlace {
    background: none;
    border: 0;
    padding: 0;
    font: inherit;
    font-size: 14px;
    color: var(--gris);
    text-decoration: underline;
    cursor: pointer;
  }

  .acciones-form {
    display: flex;
    flex-direction: column;
    gap: 10px;
    align-items: center;
    margin-bottom: 30px;
  }
  .acciones-form .btn { width: 100%; }

  /* ---------- Mensajes ---------- */
  .mensaje {
    border-radius: var(--radio);
    padding: 12px 14px;
    margin: 0 0 14px;
    background: var(--rojo-claro);
    color: var(--rojo);
    font-weight: bold;
  }
  .mensaje-ok { background: var(--verde-claro); color: var(--verde); }
  .mensaje-info { background: var(--dorado-claro); color: var(--negro); font-weight: normal; }

  /* ---------- Fotos ---------- */
  .fotos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 8px; }
  .foto {
    position: relative;
    aspect-ratio: 1 / 1;
    border: 2px dashed #CCCCCC;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    background: #FAFAFA;
  }
  .foto input[type=file] { display: none; }
  .foto .foto-boton {
    width: 100%;
    height: 100%;
    background: none;
    border: 0;
    font: inherit;
    font-size: 13px;
    color: var(--gris);
    cursor: pointer;
    padding: 4px;
  }
  .foto .foto-boton strong { display: block; font-size: 26px; color: var(--dorado); line-height: 1; }
  .foto img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .foto .foto-quitar {
    position: absolute;
    top: 4px;
    right: 4px;
    background: rgba(17,17,17,.8);
    color: var(--blanco);
    border: 0;
    border-radius: 4px;
    padding: 4px 8px;
    font-size: 13px;
    cursor: pointer;
  }
  .foto.con-foto { border-style: solid; border-color: var(--dorado); }

  /* ---------- Panel ---------- */
  .filtros {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0 10px;
    background: var(--blanco);
    border-radius: var(--radio);
    padding: 6px 12px 4px;
    margin-bottom: 10px;
  }
  @media (min-width: 720px) {
    .filtros { grid-template-columns: repeat(4, 1fr); }
  }
  .panel-barra { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }

  .indicadores { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
  @media (min-width: 720px) {
    .indicadores { grid-template-columns: repeat(4, 1fr); }
  }
  .indicador {
    background: var(--negro);
    color: var(--blanco);
    border-radius: var(--radio);
    padding: 14px 12px;
  }
  .indicador span { display: block; font-size: 28px; font-weight: bold; color: var(--dorado); }
  .indicador small { font-size: 13px; color: #CCCCCC; }

  .desgloses { display: grid; grid-template-columns: 1fr; gap: 10px; }
  @media (min-width: 720px) {
    .desgloses { grid-template-columns: 1fr 1fr; }
  }
  .tarjeta {
    background: var(--blanco);
    border-radius: var(--radio);
    padding: 12px 14px;
  }
  .tarjeta h3 { margin: 0 0 10px; font-size: 15px; }

  .barra { margin-bottom: 8px; font-size: 14px; }
  .barra-texto { display: flex; justify-content: space-between; gap: 8px; }
  .barra-texto span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .barra-fondo { background: var(--gris-claro); height: 8px; border-radius: 4px; margin-top: 3px; }
  .barra-relleno { background: var(--dorado); height: 8px; border-radius: 4px; }
  .vacio { color: var(--gris); font-size: 14px; margin: 0; }

  .titulo-lista { font-size: 17px; margin: 22px 0 10px; }

  .incidencia {
    background: var(--blanco);
    border-radius: var(--radio);
    margin-bottom: 8px;
    border-left: 4px solid var(--dorado);
  }
  .incidencia.resuelta { border-left-color: var(--verde); }
  .incidencia-cabeza {
    width: 100%;
    text-align: left;
    background: none;
    border: 0;
    font: inherit;
    color: inherit;
    padding: 12px 14px;
    cursor: pointer;
  }
  .incidencia-cabeza .linea1 { display: flex; justify-content: space-between; gap: 8px; font-weight: bold; }
  .incidencia-cabeza .linea2 { font-size: 14px; color: var(--gris); margin-top: 3px; }
  .estado {
    font-size: 12px;
    padding: 2px 8px;
    border-radius: 10px;
    white-space: nowrap;
    background: var(--dorado-claro);
    color: var(--negro);
    font-weight: bold;
  }
  .estado.resuelta { background: var(--verde-claro); color: var(--verde); }

  .incidencia-detalle { padding: 0 14px 14px; border-top: 1px solid var(--gris-claro); }
  .incidencia-detalle dl { margin: 10px 0; display: grid; grid-template-columns: 1fr; font-size: 14px; }
  @media (min-width: 560px) {
    .incidencia-detalle dl { grid-template-columns: 170px 1fr; }
  }
  .incidencia-detalle dt { color: var(--gris); margin-top: 6px; }
  .incidencia-detalle dd { margin: 0; margin-top: 6px; white-space: pre-wrap; word-break: break-word; }
  .incidencia-detalle a { color: var(--negro); }
  .cierre { background: var(--fondo); border-radius: 6px; padding: 8px 10px 10px; }
  .cierre-botones { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; }

  .texto-ayuda h3 { margin-top: 16px; }
  .texto-ayuda h3:first-child { margin-top: 0; }
  .texto-ayuda p, .texto-ayuda li { font-size: 15px; }

  /* ---------- Cargando ---------- */
  .cargando {
    position: fixed;
    inset: 0;
    background: rgba(255,255,255,.6);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 50;
  }
  .girando {
    width: 40px;
    height: 40px;
    border: 4px solid var(--gris-claro);
    border-top-color: var(--dorado);
    border-radius: 50%;
    animation: girar .8s linear infinite;
  }
  @keyframes girar { to { transform: rotate(360deg); } }
</style>
